<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản Lý Nạp Tiền & Tạo Key</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #121212; 
            color: #e0e0e0;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px 0;
            box-sizing: border-box;
        }

        .main-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(77, 171, 247, 0.5);
        }

        .login-container { 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            width: 400px; 
            box-sizing: border-box; 
            border: 1px solid #333;
            margin-top: auto;
            margin-bottom: auto;
        }
        .admin-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .admin-container { 
            display: flex; 
            gap: 20px; 
            max-width: 950px; 
            width: 100%; 
            padding: 0 20px; 
            box-sizing: border-box; 
        }
        .card { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            flex: 1; 
            box-sizing: border-box; 
            border: 1px solid #333;
        }
        h2 { 
            color: #4dabf7; 
            text-align: center; 
            margin-bottom: 20px; 
            font-size: 20px; 
        }
        label { 
            font-weight: bold; 
            font-size: 13px; 
            color: #b0b0b0; 
            display: block; 
            margin-top: 12px; 
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            background: #2d2d2d;
            border: 1px solid #444; 
            color: #fff;
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px; 
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: #4dabf7;
        }
        
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 18px; 
            border: none; 
            border-radius: 6px; 
            font-size: 14px;
            font-weight: bold; 
            cursor: pointer; 
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-green {
            background: #28a745; 
            box-shadow: 0 0 5px rgba(40, 167, 69, 0.4);
        }
        .btn-green:hover { 
            background: #218838; 
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.8), 0 0 25px rgba(40, 167, 69, 0.5);
            transform: translateY(-1px);
        }

        .btn-blue {
            background: #007bff; 
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.4);
        }
        .btn-blue:hover { 
            background: #0056b3; 
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.8), 0 0 25px rgba(0, 123, 255, 0.5);
            transform: translateY(-1px);
        }

        .logout-btn { 
            background: #dc3545; 
            width: 250px;
            margin-top: 25px;
            box-shadow: 0 0 5px rgba(220, 53, 69, 0.4);
        }
        .logout-btn:hover { 
            background: #c82333; 
            box-shadow: 0 0 15px rgba(220, 53, 69, 0.8), 0 0 25px rgba(220, 53, 69, 0.5);
            transform: translateY(-1px);
        }

        .hidden { display: none; }
        .result-box { 
            margin-top: 15px; 
            padding: 10px; 
            background: #2d2d2d; 
            border: 1px dashed #444; 
            border-radius: 6px; 
            word-break: break-all; 
            font-size: 13px; 
            min-height: 24px; 
            text-align: center; 
            color: #ddd;
        }
    </style>
</head>
<body>

    <!-- ĐĂNG NHẬP -->
    <div class="login-container" id="loginCard">
        <h2>🔐 Đăng Nhập Quản Trị</h2>
        <label>Tên đăng nhập:</label>
        <input type="text" id="username" placeholder="Nhập tên đăng nhập...">
        
        <label>Mật khẩu:</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu...">
        
        <button class="btn-green" onclick="handleLogin()">Đăng Nhập</button>
        <div id="loginError" style="color: #ff6b6b; text-align: center; margin-top: 10px; font-size: 12px;"></div>
    </div>

    <!-- QUẢN TRỊ -->
    <div class="admin-wrapper hidden" id="adminCard">
        <div class="main-title">TRANG QUẢN TRỊ KEY</div>

        <div class="admin-container">
            <!-- CỘT 1: NẠP TIỀN -->
            <div class="card">
                <h2>💳 Nạp Tiền Chat & Messenger</h2>
                
                <label>Mã Máy (HWID):</label>
                <input type="text" id="hwid" placeholder="Dán mã PC_... của khách vào đây">
                
                <label>Số tiền cần cộng (VNĐ):</label>
                <input type="number" id="amount" placeholder="Ví dụ: 50000">
                
                <button class="btn-green" onclick="addBalance()">Cộng Tiền Ngay</button>
                <div id="resultBalance" class="result-box" style="color: #aaa;">Chưa có thao tác</div>
            </div>

            <!-- CỘT 2: TẠO KEY HỆ THỐNG -->
            <div class="card">
                <h2>🔑 Tạo Key Hệ Thống</h2>
                
                <label>Chọn Server Key:</label>
                <select id="serverType" onchange="updateDurationOptions()">
                    <option value="tool_tong_hop">Key Tool Tổng Hợp</option>
                    <option value="callog">Key Callog</option>
                    <option value="huy_hang">Web - Key Hủy Hàng (Y/C hoàn)</option>
                    <option value="kien_van_de">Web - Key Kiện Vấn Đề</option>
                    <option value="loc_hang">Web - Key Lọc Hàng Hủy</option>
                </select>
                
                <label>Thời hạn:</label>
                <select id="keyDuration">
                    <!-- Sẽ tự động thay đổi mốc thời gian qua JavaScript -->
                </select>
                
                <button class="btn-blue" onclick="generateKey()">Tạo Key Mới</button>
                
                <label style="margin-top: 15px;">Kết quả Key:</label>
                <div id="resultKey" class="result-box" style="color: #4dabf7; font-weight: bold;">Chưa tạo key nào</div>
            </div>
        </div>

        <button class="logout-btn" onclick="handleLogout()">Đăng Xuất</button>
    </div>

    <script>
        window.onload = function() {
            if(localStorage.getItem("isLoggedIn") === "true") {
                showAdminPanel();
            }
            updateDurationOptions(); // Khởi tạo mốc thời gian mặc định
        }

        // Tự động thay đổi danh sách mốc thời gian phù hợp với từng Server được chọn
        function updateDurationOptions() {
            const serverType = document.getElementById('serverType').value;
            const durationSelect = document.getElementById('keyDuration');
            durationSelect.innerHTML = "";

            let options = [];
            if (serverType === "tool_tong_hop") {
                // Key tool tổng hợp dùng đuôi d / m
                options = [
                    {text: "1 Ngày (1d)", value: "1d"},
                    {text: "3 Ngày (3d)", value: "3d"},
                    {text: "7 Ngày (7d)", value: "7d"},
                    {text: "1 Tháng (1m)", value: "1m"}
                ];
            } else {
                // Các server còn lại dùng số ngày chuẩn
                options = [
                    {text: "1 Ngày", value: "1"},
                    {text: "3 Ngày", value: "3"},
                    {text: "7 Ngày", value: "7"},
                    {text: "15 Ngày", value: "15"},
                    {text: "30 Ngày", value: "30"},
                    {text: "365 Ngày (1 Năm)", value: "365"}
                ];
            }

            options.forEach(opt => {
                let el = document.createElement("option");
                el.value = opt.value;
                el.textContent = opt.text;
                durationSelect.appendChild(el);
            });
        }

        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errDiv = document.getElementById('loginError');

            if(user === "admin" && pass === "Acb@4702001") {
                localStorage.setItem("isLoggedIn", "true");
                showAdminPanel();
            } else {
                errDiv.innerText = "Sai tên đăng nhập hoặc mật khẩu!";
            }
        }

        function showAdminPanel() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('adminCard').classList.remove('hidden');
        }

        function handleLogout() {
            localStorage.removeItem("isLoggedIn");
            document.getElementById('adminCard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
        }

        async function addBalance() {
            const hwid = document.getElementById('hwid').value.trim();
            const amount = document.getElementById('amount').value;
            const resDiv = document.getElementById('resultBalance');

            if(!hwid || !amount) {
                resDiv.style.color = '#ff6b6b';
                resDiv.innerText = 'Vui lòng nhập đủ Mã Máy và Số Tiền!';
                return;
            }

            resDiv.style.color = '#aaa';
            resDiv.innerText = 'Đang xử lý...';

            try {
                let response = await fetch('https://chat.tkgolikefb002.workers.dev/add_balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        secret: "admin123", 
                        hwid: hwid, 
                        amount: parseFloat(amount) 
                    })
                });
                let data = await response.json();
                if(data.success) {
                    resDiv.style.color = '#51cf66';
                    resDiv.innerText = '✅ Thành công! Số dư mới: ' + data.new_balance.toLocaleString() + ' đ';
                    document.getElementById('hwid').value = '';
                    document.getElementById('amount').value = '';
                } else {
                    resDiv.style.color = '#ff6b6b';
                    resDiv.innerText = '❌ Lỗi: ' + (data.error || 'Thất bại');
                }
            } catch(e) {
                resDiv.style.color = '#ff6b6b';
                resDiv.innerText = '❌ Lỗi kết nối hệ thống!';
            }
        }

        async function generateKey() {
            const serverType = document.getElementById('serverType').value;
            const duration = document.getElementById('keyDuration').value;
            const resKeyDiv = document.getElementById('resultKey');

            let targetUrl = "";
            if (serverType === "tool_tong_hop") {
                targetUrl = `https://tm-key-server.tkgolikefb002.workers.dev/create?type=${duration}`;
            } else if (serverType === "callog") {
                targetUrl = `https://autocall-license.tkgolikefb002.workers.dev/create?days=${duration}`;
            } else if (serverType === "huy_hang") {
                targetUrl = `https://huyhangweb.tkgolikefb002.workers.dev/create-key?days=${duration}`;
            } else if (serverType === "kien_van_de") {
                targetUrl = `https://kienvande.tkgolikefb002.workers.dev/create-key?days=${duration}`;
            } else if (serverType === "loc_hang") {
                targetUrl = `https://lochang.tkgolikefb002.workers.dev/create-key?days=${duration}`;
            }

            resKeyDiv.style.color = '#aaa';
            resKeyDiv.innerText = 'Đang tạo key từ server...';

            try {
                let response = await fetch(targetUrl);
                let textResult = await response.text();
                
                resKeyDiv.style.color = '#51cf66';
                resKeyDiv.innerText = textResult;
            } catch(e) {
                resKeyDiv.style.color = '#ff6b6b';
                resKeyDiv.innerText = '❌ Không thể kết nối tới server tạo key (Lỗi CORS hoặc Worker lỗi)!';
            }
        }
    </script>
</body>
</html>
